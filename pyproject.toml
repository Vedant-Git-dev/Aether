[project]
name = "aether-agent"
dynamic = ["version"]
description = "Aether — Your own personal agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",  # FastAPI's multipart/form parsing for the capture upload
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "cryptography>=44",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",  # secret_env reads .env on demand (dotenv_values)
    "httpx>=0.27",
    "tenacity>=9",
    "rapidfuzz>=3.10",
    "numpy>=2.0",  # the resident vector matrix behind in-process recall
    "pyyaml>=6.0",
    "rich>=13.0",  # the setup wizard's terminal styling and intro
    "prompt_toolkit>=3.0",  # the wizard's cross-platform arrow-key prompts
    "anthropic>=1.0",
    "openai>=1.60",
    "google-genai>=1.0",
    "mcp>=2.0",
    "python-telegram-bot>=22.8",
    "py-cord>=2.8",
    "pypdf>=5.0",  # text extraction from shared PDFs (chat attachments)
    "modal>=1.0",  # the default workbench — one throwaway sandbox per background job
    "vercel>=0.12",  # the fallback sandbox — same throwaway shape, different cloud
    "rfc8785>=0.1.4",  # canonical JSON for every signed body and AAD
    "joserfc>=1.7.4",  # detached JWS with pinned algorithms
]

[project.optional-dependencies]
dev = [
    "pyhpke>=0.6.5",  # RFC 9180 HPKE for the phone-held vault
    "mnemonic>=0.21",  # recovery phrase encoding and checksum
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
]

[project.scripts]
aether = "aether.main:main"
aether-setup = "aether.setup.cli:run"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the nearest git tag (`v0.1.0` -> 0.1.0), with dev
# commits after a tag reported as the next patch plus the commit hash.
# `fallback_version` keeps a source tarball (no `.git`) buildable.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]
# The Vite panel builds into src/aether/web, which is gitignored. Hatchling
# respects .gitignore by default, so pin the built assets explicitly or
# `pip install .` ships a wheel without the panel and `/` returns 503.
artifacts = ["src/aether/web/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires AETHER_TEST_DATABASE_URL (a throwaway Postgres)",
    "e2e: browser end-to-end tests against the dev fixture server (requires `playwright install chromium`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # line length is a formatter concern, not a lint failure
]

[tool.ruff.lint.isort]
known-first-party = ["aether"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = File(...)` / `= Form(...)` /
# `= Depends(...)` — a function call in a default is the documented API, not a bug.
"src/aether/api/routes.py" = ["B008"]
