<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e4de">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aether">
<meta name="format-detection" content="telephone=no">
<title>Aether — Live Activity</title>
<link rel="icon" href="/assets/aether-mark.jpg">
<link rel="apple-touch-icon" href="/assets/aether-mark.jpg">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="shell">
  <div id="nav-scrim"></div>
  <aside id="sidebar">
    <div class="brand">
      <img src="/assets/aether-mark.jpg" alt="Aether">
      <div>
        <div class="name">ÆTHER</div>
        <div class="tag">private agent</div>
      </div>
    </div>
    <div class="workspace-label">Mission control</div>
    <nav id="nav" aria-label="Primary">
      <a class="nav-link" data-page="activity" href="#/activity">
        <span data-icon="activity"></span><span class="label">Live Activity</span>
      </a>
      <a class="nav-link" data-page="attention" href="#/attention">
        <span data-icon="attention"></span><span class="label">Attention Required</span>
        <span class="count" id="nav-attention-count" hidden></span>
      </a>
      <a class="nav-link" data-page="tasks" href="#/tasks">
        <span data-icon="tasks"></span><span class="label">Tasks</span>
      </a>
      <a class="nav-link" data-page="memory" href="#/memory">
        <span data-icon="memory"></span><span class="label">Memory &amp; Context</span>
      </a>
      <a class="nav-link" data-page="audit" href="#/audit">
        <span data-icon="audit"></span><span class="label">Audit Log</span>
      </a>
      <a class="nav-link" data-page="policy" href="#/policy">
        <span data-icon="policy"></span><span class="label">Authorization &amp; Policies</span>
      </a>
      <a class="nav-link" data-page="apps" href="#/apps">
        <span data-icon="apps"></span><span class="label">Apps &amp; Permissions</span>
      </a>
      <a class="nav-link" data-page="settings" href="#/settings">
        <span data-icon="settings"></span><span class="label">Settings</span>
      </a>
    </nav>
    <div id="sidebar-footer">
      <button id="collapse-btn" type="button" aria-label="Collapse sidebar">
        <span data-icon="collapse"></span>
      </button>
    </div>
  </aside>
  <div id="main">
    <header id="topbar">
      <button id="menu-btn" type="button" aria-label="Open navigation">
        <span data-icon="menu"></span>
      </button>
      <h1 id="page-title">Live Activity</h1>
      <span class="breadcrumb" id="topbar-breadcrumb"></span>
      <div id="topbar-clock" class="mono"><span data-icon="clock"></span><span class="t-inner"></span></div>
      <a id="topbar-bell" href="#/attention" aria-label="Attention required">
        <span data-icon="bell"></span>
        <span class="count" id="bell-count" hidden></span>
      </a>
    </header>
    <main id="page" role="main"></main>
  </div>
</div>
<div class="toast-stack" id="toasts" aria-live="polite"></div>
<script src="/assets/app.js"></script>
</body>
</html>
