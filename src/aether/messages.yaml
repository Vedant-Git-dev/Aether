# Fixed user-facing text, keyed and parameterised.
#
# Every key lives under a locale. The loader falls back to the default
# locale, so adding a language is data work, not a code change. Model-authored
# text never lives here; this file is only for the sentences the backend owns.
default_locale: en
locales:
  en:
    ask.options: "{question}\n\nOptions: {options}"
    verification.caveat: "I left out {count} detail(s) I could not confirm."
    verification.safe_fallback: "I could not put that answer together reliably. Could you ask me again?"
    verification.unsupported: "I could not confirm part of that answer, so I left it out."
    alerts.set: "Alert set: {title} — {condition}."
    alerts.set_reminder: "Reminder set: {title} at {when}."
    alerts.updated: "Alert updated: {title} — {condition}."
    alerts.updated_reminder: "Reminder updated: {title} at {when}."
    alerts.removed: "Removed: {title}."
    alerts.paused: "Paused: {title}."
    alerts.resumed: "Resumed: {title}."
    alerts.not_found: "There is no alert with that number."
    alerts.refused: "Only you can change your alerts — I won't do it from a message I read or a feed I polled."
    alerts.needs_condition: "An alert needs something to match — a sender, some words, or a source."
    alerts.reminder_needs_time: "A reminder needs a time."
    alerts.scope_unknown: "I don't know a source called {scope}."
    alerts.scope_unsupported: "{label} can't notify me yet."
    alerts.scope_alternative: " I can watch {label} instead."
    alerts.scope_no_alternative: " {label} doesn't send me anything I can watch."
    alerts.condition_scope: "{label}"
    alerts.condition_sender: "from {sender}"
    alerts.condition_contains: "mentioning \"{words}\""
    alerts.condition_event: "only {event}"
    alerts.list_empty: "Nothing is set."
    alerts.needs_id: "Tell me which alert — list them first."
    alerts.list_alerts: "Alerts"
    alerts.list_reminders: "Reminders"
    alerts.list_scheduled: "Scheduled actions"
    alerts.list_line: "{title} — {condition}"
    alerts.list_reminder_line: "{title} — {when}"
    alerts.note: "{title} — {detail}"
    alerts.digest: "{title} — {count} new"
    alerts.detail: "{source}: {detail}"
    alerts.detail_from: "{source} from {sender}: {detail}"
    alerts.reminder_note: "Reminder: {title}"
    alerts.no_surface: "I couldn't reach any of your surfaces just now."
