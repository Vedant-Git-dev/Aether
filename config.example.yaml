# Aether configuration.
#
# Copy to config.yaml and edit. Secrets belong in .env, never here.
# The same settings are editable from chat (/config) and the Settings page.
#
# Every field is marked REQUIRED or optional with its default. Structure
# only: agent cadence, thresholds and budgets default in code.

llm:
  # REQUIRED one of: anthropic | openai | gemini | ollama | nvidia
  provider: anthropic
  # REQUIRED a model id the provider can reach
  model: claude-opus-5

  # other examples: openai,  model: gpt-5.1
  #                 gemini,  model: gemini-2.5-pro
  #                 ollama,  model: llama3.3
  #                 nvidia,  model: meta/llama-3.1-405b-instruct

  # optional (default: off) memory search is on with a model id, off with "off"
  embedding_model: "off"

  # optional (default: off) image reading
  image_model:
  # optional (default: off) audio listening
  audio_model:
  # optional (default: off) video watching
  video_model:
  # optional (default: use the main model) the first-pass skim
  salience_model:

# Optional MCP servers. Keys are referenced by name ($NAME) from the
# encrypted store.
mcp_servers: []

messaging:
  # optional (default: false) requires TELEGRAM_BOT_TOKEN
  telegram:
    enabled: false
  # optional (default: false) requires DISCORD_BOT_TOKEN
  discord:
    enabled: false

contacts:
  # optional (default: off) enforce | off
  mode: "off"
  allowlist: []
  gmail:
    mode: null
    allowlist: []
  telegram:
    mode: null
    allowlist: []
  discord:
    mode: null
    allowlist: []

authz:
  # optional (default: [])
  rules: []
  # optional (default: 24)
  approval_ttl_hours: 24.0

memory:
  # optional (default: true)
  enrichment: true
  # optional (default: true)
  query_pipeline: true
  # optional (default: false)
  summaries: false
  # optional (default: 10)
  summary_thread_messages: 10
  # optional (default: 1500)
  core_facts_chars: 1500
  # optional (default: 120)
  conclusion_ttl_seconds: 120
  # optional (default: enforce) off | warn | enforce
  schema_audit: enforce

workspace:
  # optional (default: true)
  enabled: true
  # optional (default: aether-workspace)
  path: aether-workspace
  # optional (default: true, retained for older files)
  encrypted: true

notifications:
  # optional (default: true) may Aether send a note you did not ask for?
  # replies to your messages are never affected
  enabled: true
  # optional (default: 0.0, range 0-10) how urgent something must be before
  # it may interrupt you
  min_urgency: 0.0
  # optional (default: 360) how long an event or action counts as already
  # reported, so Aether does not repeat itself
  repeat_window_minutes: 360

proactive:
  # optional (default: false)
  enabled: false
  skills:
    - followups
    - research
    - media
  # optional (default: true)
  watches_enabled: true
  # optional (default: true)
  urgent_mail_alerts: true
  # optional (default: 2, range 0-3)
  urgent_urgency_min: 2
  # optional (default: 6)
  max_alerts_per_hour: 6
  # optional (default: true)
  reminders_enabled: true
  # optional (default: 0.15)
  poll_jitter: 0.15

workbench:
  # optional (default: modal) modal | vercel | github_actions | none
  provider: modal
  # optional (default: "", required for the GitHub Actions queue)
  actions_repo: ""
  # optional (default: "", required for the GitHub Actions queue)
  actions_workflow: ""

media:
  # optional (default: pollinations) pollinations | gemini | none
  image_provider: pollinations

providers:
  # optional (default: true) needs AETHER_TOKEN_ENCRYPTION_KEY
  enabled: true
