# Aether configuration.
#
# Copy to config.yaml and edit. Secrets belong in .env, never here.
# The same settings are editable from chat (/config) and the Settings page.
#
# Every field is marked REQUIRED or optional with its default. Structure
# only: agent cadence, thresholds and budgets default in code.

llm:
  # REQUIRED one of: anthropic | openai | gemini | ollama | nvidia | groq
  provider: anthropic
  # REQUIRED a model id the provider can reach
  model: claude-opus-5

  # other examples: openai,  model: gpt-5.1
  #                 gemini,  model: gemini-2.5-pro
  #                 ollama,  model: llama3.3
  #                 nvidia,  model: meta/llama-3.1-405b-instruct
  #                 groq,    model: llama-3.3-70b-versatile
  #                 (Groq: an id whose first segment is a provider name, like
  #                  openai/gpt-oss-120b, needs the groq/ prefix. Free-tier
  #                  Groq models have low per-minute token budgets.)

  # optional (default: off) memory search is on with a model id, off with "off"
  embedding_model: "off"

  # optional (default: off) image reading
  image_model:
  # optional (default: off) audio listening
  audio_model:
  # optional (default: off) video watching
  video_model:
  # optional (default: use the main model) the first-pass skim
  salience_model:

# Optional MCP servers. Keys are referenced by name ($NAME) from the
# encrypted store.
mcp_servers: []

# Database use. The meters are in process memory (counts and query shapes
# only) and serve `aether db-stats` and the panel's Database Use page.
db:
  # optional (default: true) measure every query
  accounting: true
  # optional (default: 0 / 5 / 60) the one shared connection pool: a zero
  # floor and a short idle lifetime release every connection when quiet
  pool_min_size: 0
  pool_max_size: 5
  pool_idle_seconds: 60.0
  # optional (default: 15) non-urgent background work runs in bursts this
  # far apart; a new message never waits for the window
  background_window_minutes: 15.0
  # optional (default: 900) vector backfill retry cadence once drained
  backfill_seconds: 900.0
  # optional (default: 100) hard cap for one panel list page
  panel_page_size: 100
  # optional (default: 20 / 12 / 2.0) one simulated day for the replay
  replay_messages_per_day: 20
  replay_mails_per_day: 12
  replay_panel_hours: 2.0
  # optional (default: 2500 / 120 / 600) one replay day's regression ceilings
  daily_query_budget: 2500
  daily_response_budget_mb: 120.0
  daily_active_minutes_budget: 600
  # optional (default: Neon free tier) used only to project a replay day
  monthly_compute_cu_hours: 100.0
  monthly_transfer_gb: 5.0
  compute_cu: 0.25
  autosuspend_seconds: 300

messaging:
  # optional (default: false) requires TELEGRAM_BOT_TOKEN
  telegram:
    enabled: false
  # optional (default: false) requires DISCORD_BOT_TOKEN
  discord:
    enabled: false

contacts:
  # optional (default: off) enforce | off
  mode: "off"
  allowlist: []
  gmail:
    mode: null
    allowlist: []
  telegram:
    mode: null
    allowlist: []
  discord:
    mode: null
    allowlist: []

authz:
  # optional (default: [])
  rules: []
  # optional (default: 24)
  approval_ttl_hours: 24.0

memory:
  # optional (default: true)
  enrichment: true
  # optional (default: true)
  query_pipeline: true
  # optional (default: false)
  summaries: false
  # optional (default: 10)
  summary_thread_messages: 10
  # optional (default: 1500)
  core_facts_chars: 1500
  # optional (default: 120)
  conclusion_ttl_seconds: 120
  # optional (default: enforce) off | warn | enforce
  schema_audit: enforce

workspace:
  # optional (default: true)
  enabled: true
  # optional (default: aether-workspace)
  path: aether-workspace
  # optional (default: true, retained for older files)
  encrypted: true

tools:
  # optional (default: enforce) off | warn | enforce — every native tool must
  # have a manifest under src/aether/tools/manifests/ before booting
  manifest_audit: enforce

proactive:
  # optional (default: false)
  enabled: false
  skills:
    - followups
    - research
    - media
  # optional (default: true)
  reminders_enabled: true
  # optional (default: 0.15)
  poll_jitter: 0.15

alerts:
  # optional (default: true)
  enabled: true
  # optional (default: 2) hours to fold a repeat note into the next batch
  tell_window_hours: 2
  # optional (default: 30) minutes a digest-style alert collects matches
  digest_minutes: 30
  # optional (default: 12) alert notifications per local day, all alerts
  daily_cap: 12
  # optional (default: 5) minutes between retries of a failed send
  retry_minutes: 5
  # optional (default: 3) tries one notification gets before it is dropped
  max_attempts: 3
  # optional (default: 300) seconds between folded-action fires
  action_cooldown_seconds: 300
  # optional (default: true) let the model phrase a notification from the
  # facts it matched; off uses the fixed catalog sentences
  compose_wording: true
  # optional (default: 2027-02-11) when the `watches` view is dropped
  compat_until: "2027-02-11"

workbench:
  # optional (default: modal) modal | vercel | github_actions | none
  provider: modal
  # optional (default: "", required for the GitHub Actions queue)
  actions_repo: ""
  # optional (default: "", required for the GitHub Actions queue)
  actions_workflow: ""

media:
  # optional (default: pollinations) pollinations | gemini | none
  image_provider: pollinations

providers:
  # optional (default: true) needs AETHER_TOKEN_ENCRYPTION_KEY
  enabled: true
  gmail:
    # optional (default: 5) minutes between history polls
    poll_minutes: 5
    # optional (default: 60) minutes between the lookback reconcile sweep
    reconcile_minutes: 60
    # optional (default: 24) how far back that sweep looks
    reconcile_lookback_hours: 24
