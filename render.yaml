services:
  - type: web
    name: aether
    runtime: docker
    plan: starter
    # The image CMD has no --allow-unconfigured, so a fresh disk with no
    # aether.json exits before binding. Render has no shell before the first
    # boot, so the flag has to come from the blueprint.
    dockerCommand: node aether.mjs gateway --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      - key: AETHER_GATEWAY_PORT
        value: "8080"
      - key: AETHER_STATE_DIR
        value: /data/.aether
      - key: AETHER_WORKSPACE_DIR
        value: /data/workspace
      - key: AETHER_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: aether-data
      mountPath: /data
      sizeGB: 1
