# Aether on Render - Blueprint (no secrets).
#
# Render Dashboard -> New -> Blueprint -> pick the repo. Paste each
# sync: false value when Render prompts for it.

services:
  - type: web
    name: aether
    runtime: python
    plan: free
    region: oregon
    buildCommand: 'if [ -n "$AETHER_CONFIG_B64" ]; then printf %s "$AETHER_CONFIG_B64" | base64 -d > config.yaml; fi; cd webapp && npm ci && npm run build && cd .. && pip install .'
    startCommand: 'aether'
    healthCheckPath: /healthz
    # Free instances cannot attach a disk. On a paid plan, uncomment this and
    # mount the workspace path so IDENTITY.md / SOUL.md / MEMORY.md survive:
    # disk:
    #   name: workspace
    #   mountPath: /opt/render/project/src/aether-workspace
    #   sizeGB: 1
    envVars:
      # --- required ---
      - key: DATABASE_URL
        sync: false
      - key: AETHER_ENCRYPTION_KEY
        sync: false
      - key: AETHER_TOKEN
        sync: false
      - key: AETHER_CONFIG_B64
        sync: false
      # --- runtime pins ---
      - key: PYTHON_VERSION
        value: '3.12.11'
      - key: NODE_VERSION
        value: '22.12.0'
      # --- public URL (set from Render's own default variable) ---
      - key: AETHER_PUBLIC_URL
        fromService:
          name: aether
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # --- model provider (set the one matching llm.provider) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # --- optional services ---
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: GITHUB_ACTIONS_TOKEN
        sync: false
      # --- direct apps: token keyring + OAuth clients ---
      - key: AETHER_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: AETHER_TOKEN_ENCRYPTION_KEY_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PICKER_API_KEY
        sync: false
      - key: GOOGLE_PICKER_APP_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      # --- chat channels ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false